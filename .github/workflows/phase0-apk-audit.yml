name: 'Phase 0 APK artifact audit'

on:
  push:
    branches: [main]
    paths: ['.github/workflows/phase0-apk-audit.yml']
  workflow_run:
    workflows: ['Phase 0 code and Android verification']
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run:
        description: 'Successful Android CI run ID containing APK artifact'
        required: true
        default: '39326177878'

permissions:
  contents: read
  actions: read

jobs:
  inspect-uploaded-apks:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.source_run || github.event_name == 'push' && '39326177878' || github.event.workflow_run.id }}
    steps:
      - name: Download exact APKs from successful CI run
        uses: actions/download-artifact@v6
        with:
          name: liftria-phase0-s22-arm64-apks
          run-id: ${{ env.SOURCE_RUN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: apks
      - name: Verify both Android APKs and embedded offline release bundle
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t debugs < <(find apks -type f -name 'app-debug.apk')
          mapfile -t releases < <(find apks -type f -name 'app-release.apk')
          test "${#debugs[@]}" -eq 1
          test "${#releases[@]}" -eq 1
          debug="${debugs[0]}"
          release="${releases[0]}"
          test -s "$debug"
          test -s "$release"
          printf 'Debug APK: %s\nRelease APK: %s\n' "$debug" "$release"
          sha256sum "$debug" "$release"
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          mapfile -t tools < <(find "$sdk/build-tools" -maxdepth 2 -type f -name apksigner | sort -V)
          test "${#tools[@]}" -gt 0
          signer="${tools[${#tools[@]}-1]}"
          "$signer" verify --verbose "$debug"
          "$signer" verify --verbose "$release"
          mapfile -t aapts < <(find "$sdk/build-tools" -maxdepth 2 -type f -name aapt | sort -V)
          test "${#aapts[@]}" -gt 0
          aapt="${aapts[${#aapts[@]}-1]}"
          "$aapt" dump badging "$release" | grep -F "package: name='com.liftria.diagnostics'"
          "$aapt" dump badging "$release" | grep 'sdkVersion:'
          echo 'Release assets:'
          unzip -Z1 "$release" | grep -E '^assets/(index.android.bundle|.*\.hbc)$'
          echo 'Release ARM64 libraries:'
          unzip -Z1 "$release" | grep -m 3 '^lib/arm64-v8a/'
          echo 'Both APKs are signed, the release contains bundled JS, and the expected Android package/ARM64 libraries are present.'
