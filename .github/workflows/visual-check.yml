name: Visual check (emulator screenshots)

# After a successful PR build, boots an Android emulator, installs that build's release APK,
# screenshots every hidden primitive story in dark and light, and posts them on the PR.
# The APK only runs inside the emulator; no PR code runs on the runner itself.

on:
  workflow_run:
    workflows: ["Phase 0 code and Android verification"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "ID of a successful 'Phase 0 code and Android verification' run whose APK to check"
        required: true
      pr:
        description: "PR number to comment on"
        required: true

concurrency:
  group: visual-check-${{ github.event.workflow_run.head_branch || inputs.pr }}
  cancel-in-progress: true

jobs:
  # Draft PR runs skip android-build, so there may be no APK: skip the emulator quietly then.
  has-apk:
    if: >-
      github.event_name == 'workflow_dispatch' || (
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.pull_requests[0].number )
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      apk: ${{ steps.find.outputs.apk }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
        run: |
          n=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/artifacts" --jq '[.artifacts[] | select(.name=="liftria-phase0-s22-arm64-apks")] | length')
          echo "apk=$([ "${n:-0}" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          [ "${n:-0}" -gt 0 ] || echo "No APK in run $RUN_ID (draft PR build skipped); no emulator check."

  screenshots:
    needs: has-apk
    if: needs.has-apk.outputs.apk == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write        # only to push screenshots to the visual-checks branch
      pull-requests: write   # to comment on the PR
      actions: read          # to download the build's APK artifact
    env:
      PR: ${{ inputs.pr || github.event.workflow_run.pull_requests[0].number }}
      SHA: ${{ github.event.workflow_run.head_sha || inputs.run_id }}
      RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Download the PR build's APKs
        uses: actions/download-artifact@v4
        with:
          name: liftria-phase0-s22-arm64-apks
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: apks

      - name: Find the release APK
        id: apk
        run: |
          APK=$(find apks -name '*release*.apk' | head -n1)
          test -n "$APK" || { echo "::error::No release APK in the artifact"; exit 1; }
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Screenshot every primitive story on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30   # Android 11 x86_64 images translate the arm64-only APK (the build targets the S22)
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/visual-check.sh "${{ steps.apk.outputs.path }}" shots

      - name: Keep the screenshots as an artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: visual-check-pr${{ env.PR }}-${{ env.SHA }}
          path: shots
          retention-days: 14

      - name: Publish screenshots to the visual-checks branch
        id: publish
        run: |
          SHORT=${SHA:0:7}
          DIR="pr-$PR/$SHORT"
          git config user.name "liftria-visual-check"
          git config user.email "visual-check@users.noreply.github.com"
          git fetch -q origin visual-checks || true
          if git rev-parse -q --verify origin/visual-checks >/dev/null; then
            git switch -q -c visual-checks origin/visual-checks
          else
            git switch -q --orphan visual-checks && git rm -rq --cached . 2>/dev/null || true
            find . -mindepth 1 -maxdepth 1 ! -name .git ! -name shots -exec rm -rf {} +
          fi
          mkdir -p "$DIR" && cp shots/*.png shots/*.txt "$DIR"/ 2>/dev/null || cp shots/*.png "$DIR"/
          git add "$DIR" && git commit -qm "Visual check PR #$PR at $SHORT" && git push -q origin visual-checks
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Comment on the PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIR: ${{ steps.publish.outputs.dir }}
        run: |
          BASE="https://github.com/${{ github.repository }}/blob/visual-checks/$DIR"
          {
            echo "## Emulator visual check · \`${SHA:0:7}\`"
            echo
            echo "Release APK on an Android 11 emulator (Pixel 6 size). The real phone stays the final check."
            echo
            for mode in dark light ar-dark; do
              ls shots/$mode-*.png >/dev/null 2>&1 || continue
              if [ "$mode" = ar-dark ]; then echo "### Arabic (RTL), dark"; else echo "### ${mode^}"; fi
              echo
              echo "| | | |"; echo "|---|---|---|"
              row=""; n=0
              for f in shots/$mode-*.png; do
                name=$(basename "$f" .png); name=${name#$mode-}
                row="$row| **$name**<br><img src=\"$BASE/$mode-$name.png?raw=true\" width=\"240\"> "
                n=$((n+1)); if [ $n -eq 3 ]; then echo "$row|"; row=""; n=0; fi
              done
              [ -n "$row" ] && echo "$row|"
              echo
            done
            if grep -qs "FATAL EXCEPTION\\|Fatal signal" shots/logcat-crash.txt shots/logcat-errors.txt; then
              echo "> ⚠️ **The app crashed on the emulator.** Crash log: [logcat-crash.txt](https://github.com/${{ github.repository }}/blob/visual-checks/$DIR/logcat-crash.txt)"
              echo
            fi
            echo "Compare with \`docs/phase1/reference/\`."
          } > comment.md
          gh pr comment "$PR" --repo "${{ github.repository }}" --body-file comment.md
