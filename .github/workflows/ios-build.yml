name: iPhone build (simulator)

# Proves the app builds for iPhone, gives an unsigned simulator .app to inspect, and screenshots
# the iPhone screens on a simulator (ios-visual-check.yml posts them on the PR).
# A device or TestFlight build needs the owner's Apple Developer account and signing secrets.
# Runs by hand, or on a PR with the `ios` label.

on:
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize]

concurrency:
  group: ios-build-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  simulator:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ios')
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Use the newest Xcode on the runner
        # Expo's native packages need Swift 6.2+ (Xcode 26); the image's default Xcode is older.
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          swift --version

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Expo iOS prebuild
        run: npx expo prebuild --clean --platform ios

      - name: Build for the iPhone simulator (unsigned)
        env:
          # Not a store build: keep the demo routes the screenshot pass opens.
          EXPO_PUBLIC_LIFTRIA_DEV_ROUTES: '1'
        run: |
          set -o pipefail
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace | head -n1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          if ! xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build > ../xcodebuild.log 2>&1; then
            echo "::group::Errors"; grep -nE -A15 "error:|fatal error|Undefined symbol|ld: " ../xcodebuild.log | head -n 200; echo "::endgroup::"
            echo "::group::Failing script output"; grep -n -B2 -A40 "PhaseScriptExecution" ../xcodebuild.log | grep -v "^[0-9]*-note:" | head -n 200; echo "::endgroup::"
            tail -n 60 ../xcodebuild.log; exit 1
          fi
          tail -n 20 ../xcodebuild.log

      - name: Check the iPhone permission texts
        run: |
          PLIST=$(find ios/build/Build/Products -name Info.plist -path '*.app/Info.plist' | head -n1)
          for key in NSCameraUsageDescription NSPhotoLibraryUsageDescription NSHealthShareUsageDescription; do
            /usr/libexec/PlistBuddy -c "Print :$key" "$PLIST"
          done
          # Nothing beyond what the app uses: no location, microphone, contacts or tracking texts,
          # and no Apple Health write prompt (Liftria only reads).
          for key in NSLocationWhenInUseUsageDescription NSMicrophoneUsageDescription NSContactsUsageDescription NSUserTrackingUsageDescription NSHealthUpdateUsageDescription; do
            if /usr/libexec/PlistBuddy -c "Print :$key" "$PLIST" >/dev/null 2>&1; then
              echo "::error::Unexpected iPhone permission $key"; exit 1
            fi
          done

      - name: Keep the simulator app
        run: |
          APP=$(find ios/build/Build/Products -maxdepth 2 -name '*.app' | head -n1)
          ditto -c -k --keepParent "$APP" liftria-ios-simulator.zip

      - name: Screenshot the iPhone screens on a simulator
        # Screenshots are for review; a failed pass must not hide a good build.
        continue-on-error: true
        run: |
          APP=$(find ios/build/Build/Products -maxdepth 2 -name '*.app' | head -n1)
          bash .github/scripts/ios-visual-check.sh "$APP" ios-shots
          echo "${{ github.event.pull_request.number }}" > ios-shots/pr.txt
          echo "${{ github.event.pull_request.head.sha || github.sha }}" > ios-shots/sha.txt

      - name: Keep the iPhone screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: liftria-ios-screenshots
          path: ios-shots
          if-no-files-found: ignore
          retention-days: 14

      - name: Keep the Xcode log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: liftria-ios-xcodebuild-log
          path: xcodebuild.log
          retention-days: 14

      - uses: actions/upload-artifact@v6
        with:
          name: liftria-ios-simulator
          path: liftria-ios-simulator.zip
          retention-days: 14
