name: Temporary Phase 2 Expo dependency install

on:
  push:
    branches: [phase2/01-tokens-theme]
    paths:
      - '.github/workflows/phase2-lock-refresh.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install the Expo SDK-compatible splash dependency and update lockfile
        run: |
          npm ci --no-audit --no-fund
          npx expo install expo-splash-screen
          npx expo install --check
          npm ci --no-audit --no-fund
      - name: Commit dependency and lockfile only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build(phase2): install expo-splash-screen with Expo SDK-compatible lockfile"
            git push origin HEAD:phase2/01-tokens-theme
          fi
