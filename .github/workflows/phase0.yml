name: 'Phase 0 repair: dependency lockfile'
on:
  push:
    branches: [main]
    paths:
      - 'app.config.ts'
      - '.github/workflows/phase0.yml'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: liftria-phase0-repair
  cancel-in-progress: false

jobs:
  refresh-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Resolve SDK-matched native dependencies
        run: |
          npm ci --no-audit --no-fund
          npx expo install expo-system-ui react-native-reanimated react-native-worklets
          npx expo install --check
          npm ls react-native-reanimated react-native-worklets
      - name: Persist checked package.json and package-lock.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --stat
          if ! git diff --cached --quiet; then
            git commit -m "chore: align Expo 57 native UI and worklets dependencies"
            git push origin HEAD:main
          fi
