name: Phase 0 code verification
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'PHASE_0_ISSUES.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: liftria-phase0-verify
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Reproducible install from committed lockfile
        run: npm ci --no-audit --no-fund
      - name: Check SDK 57 dependency compatibility
        run: npx expo install --check
      - name: TypeScript lint Jest
        run: npm run check
