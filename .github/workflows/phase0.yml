name: Phase 0 code and Android verification

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'PHASE_0_ISSUES.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase0-${{ github.ref }}
  # A newer push to the same PR makes the running 40-minute build pointless.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Reproducible clean dependency install
        run: npm ci --no-audit --no-fund
      - name: Validate Expo SDK versions and native peer dependency tree
        run: |
          npx expo install --check
          npm ls react-native-reanimated react-native-worklets
      - name: TypeScript, lint, Jest
        run: npm run check

  android-build:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
      - name: Free disk for ARM64 native compilation
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      # Caches Gradle dependencies and wrapper between runs.
      - uses: gradle/actions/setup-gradle@v5
      - name: Install reproducible dependencies
        run: npm ci --no-audit --no-fund
      # Gradle's on-demand NDK download has twice failed with "Archive is not a ZIP archive"
      # (PR #3, PR #6). Install the NDK React Native needs up front, verify it, and retry.
      - name: Install Android NDK with retries
        env:
          NDK_VERSION: 27.0.12077973
        run: |
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          manager="$sdk/cmdline-tools/latest/bin/sdkmanager"
          for attempt in 1 2 3; do
            if [ -f "$sdk/ndk/$NDK_VERSION/source.properties" ]; then echo "NDK $NDK_VERSION ready"; break; fi
            rm -rf "$sdk/ndk/$NDK_VERSION"
            yes | "$manager" --install "ndk;$NDK_VERSION" > /dev/null || echo "::warning::NDK install attempt $attempt failed"
            sleep 5
          done
          test -f "$sdk/ndk/$NDK_VERSION/source.properties"
      - name: Test release signing Gradle template patch
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      # GitHub Actions expressions have no arithmetic (+) operator. Compute the same
      # 100 + github.run_number with Bash integer arithmetic, before Expo prebuild.
      # GITHUB_RUN_NUMBER increases for each invocation of this workflow.
      - name: Allocate trusted Android versionCode
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        run: |
          set -euo pipefail
          code=$((100 + GITHUB_RUN_NUMBER))
          printf 'LIFTRIA_ANDROID_VERSION_CODE=%s\n' "$code" >> "$GITHUB_ENV"
          echo "Trusted main build Android versionCode: $code"
      - name: Expo Android prebuild
        run: npx expo prebuild --clean --platform android --no-install

      # Only a trusted main build may access release secrets. Never expose them to
      # pull-request code (including same-repo PRs), or to non-main dispatches.
      - name: Prepare trusted release keystore
        id: release_signing
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.LIFTRIA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.LIFTRIA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LIFTRIA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LIFTRIA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::warning::No complete release-signing configuration. A debug-signed release will be produced: NOT FOR SHARING."
            exit 0
          fi
          umask 077
          keyfile="$RUNNER_TEMP/liftria-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keyfile"
          test -s "$keyfile"
          if ! keytool -list -keystore "$keyfile" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::Release keystore validation failed. Refusing to ship under an unexpected certificate."
            exit 1
          fi
          echo 'ready=true' >> "$GITHUB_OUTPUT"
          echo "Trusted signing keystore loaded to the temporary runner directory."

      - name: Configure trusted signing in generated Gradle file
        if: ${{ steps.release_signing.outputs.ready == 'true' }}
        env:
          LIFTRIA_SIGNING_KEYSTORE: ${{ format('{0}/liftria-release.jks', runner.temp) }}
          LIFTRIA_KEYSTORE_PASSWORD: ${{ secrets.LIFTRIA_KEYSTORE_PASSWORD }}
          LIFTRIA_KEY_ALIAS: ${{ secrets.LIFTRIA_KEY_ALIAS }}
          LIFTRIA_KEY_PASSWORD: ${{ secrets.LIFTRIA_KEY_PASSWORD }}
        run: python3 scripts/configure_release_signing.py android/app/build.gradle

      - name: Compile ARM64 debug and embedded-bundle release APKs
        working-directory: android
        # Preserve x86_64 on PR releases for the emulator visual-check workflow.
        # Main releases target both 64-bit and 32-bit Android 9+ phones.
        env:
          RELEASE_ARCHS: ${{ github.event_name == 'pull_request' && 'arm64-v8a,x86_64' || 'arm64-v8a,armeabi-v7a' }}
          LIFTRIA_SIGNING_KEYSTORE: ${{ steps.release_signing.outputs.ready == 'true' && format('{0}/liftria-release.jks', runner.temp) || '' }}
          LIFTRIA_KEYSTORE_PASSWORD: ${{ steps.release_signing.outputs.ready == 'true' && secrets.LIFTRIA_KEYSTORE_PASSWORD || '' }}
          LIFTRIA_KEY_ALIAS: ${{ steps.release_signing.outputs.ready == 'true' && secrets.LIFTRIA_KEY_ALIAS || '' }}
          LIFTRIA_KEY_PASSWORD: ${{ steps.release_signing.outputs.ready == 'true' && secrets.LIFTRIA_KEY_PASSWORD || '' }}
        run: |
          set -euo pipefail
          ./gradlew assembleDebug -PreactNativeArchitectures=arm64-v8a --no-daemon --max-workers=2
          ./gradlew assembleRelease -PreactNativeArchitectures="$RELEASE_ARCHS" --no-daemon --max-workers=2

      - name: Mark non-distributable release APKs NOT FOR SHARING
        if: ${{ steps.release_signing.outputs.ready != 'true' }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          releases = list(Path('android/app/build/outputs/apk/release').glob('*-release.apk'))
          if not releases:
              raise SystemExit('No release APK found for mandatory NOT FOR SHARING label')
          for path in releases:
              path.rename(path.with_name(path.stem + '-NOT-FOR-SHARING.apk'))
          print('Release APKs use a development/test certificate — NOT FOR SHARING.')
          PY
      # Upload before the permission gate so a failed gate still leaves the APKs to inspect.
      - name: Upload debug and release APK artifacts
        uses: actions/upload-artifact@v6
        with:
          name: liftria-phase0-s22-arm64-apks
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Check release APK permissions
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          ANDROID = '{http://schemas.android.com/apk/res/android}'
          FORBIDDEN = {
              'android.permission.RECORD_AUDIO',
              'android.permission.SYSTEM_ALERT_WINDOW',
              'android.permission.CAMERA',
          }

          def permissions(variant):
              found = list(Path('android/app/build/intermediates/merged_manifests').glob(f'{variant}/**/AndroidManifest.xml'))
              if not found:
                  raise SystemExit(f'No merged {variant} manifest found; permissions unverified')
              root = ET.parse(found[0]).getroot()
              return sorted(
                  (child.get(ANDROID + 'name'), child.get(ANDROID + 'maxSdkVersion'))
                  for child in root
                  if child.tag in ('uses-permission', 'uses-permission-sdk-23')
              )

          # The debug (dev client) build legitimately gets SYSTEM_ALERT_WINDOW from
          # React Native's debug manifest for the dev overlay; it is informational only.
          for variant in ('debug', 'release'):
              print(f'== {variant} ==')
              for name, max_sdk in permissions(variant):
                  print(f'{name} maxSdkVersion={max_sdk or "none"}')

          shipped = {name for name, _ in permissions('release')} & FORBIDDEN
          if shipped:
              raise SystemExit(f'Forbidden permission in release APK: {sorted(shipped)}')

          # Verify the new package and manifest, never the previous Phase 0 identity.
          root = ET.parse(next(Path('android/app/build/intermediates/merged_manifests').glob('release/**/AndroidManifest.xml'))).getroot()
          if root.get('package') != 'com.liftria.app':
              raise SystemExit('Wrong Android package: expected com.liftria.app')
          print('Release APK package and permissions OK: com.liftria.app')
          PY

      - name: Verify APK metadata and signatures
        env:
          EXPECTED_ARCHS: ${{ github.event_name == 'pull_request' && 'arm64-v8a,x86_64' || 'arm64-v8a,armeabi-v7a' }}
          TRUSTED_MAIN_BUILD: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import subprocess

          sdk = Path(os.environ.get('ANDROID_HOME') or os.environ.get('ANDROID_SDK_ROOT') or '/usr/local/lib/android/sdk')
          aapt = sorted((sdk / 'build-tools').glob('*/aapt'))
          apksigner = sorted((sdk / 'build-tools').glob('*/apksigner'))
          if not aapt or not apksigner:
              raise SystemExit('Missing Android build tools: cannot verify release')
          releases = list(Path('android/app/build/outputs/apk/release').glob('*release*.apk'))
          if not releases:
              raise SystemExit('No release APK found for verification')
          fallback_code = json.loads(Path('src/config/releaseVersion.json').read_text())['androidCode']
          trusted_main = os.environ['TRUSTED_MAIN_BUILD'] == 'true'
          for apk in releases:
              metadata = subprocess.check_output([str(aapt[-1]), 'dump', 'badging', str(apk)], text=True)
              match = re.search(r"\bversionCode='([0-9]+)'", metadata)
              if not match:
                  raise SystemExit('Cannot parse release APK versionCode')
              version_code = int(match.group(1))
              print('APK Android versionCode:', version_code)
              if trusted_main:
                  if version_code <= fallback_code:
                      raise SystemExit('Trusted release versionCode did not exceed the JSON baseline')
                  if version_code != int(os.environ['LIFTRIA_ANDROID_VERSION_CODE']):
                      raise SystemExit('Trusted release versionCode disagrees with automatic run number')
              elif version_code != fallback_code:
                  raise SystemExit('PR/test APK must use the JSON fallback versionCode')
              if "name='com.liftria.app'" not in metadata:
                  raise SystemExit('Wrong release APK application ID')
              if "sdkVersion:'28'" not in metadata:
                  raise SystemExit('Wrong APK minSdk: expected Android 9 (API 28)')
              native = next((line for line in metadata.splitlines() if line.startswith('native-code:')), '')
              for arch in os.environ['EXPECTED_ARCHS'].split(','):
                  if f"'{arch}'" not in native:
                      raise SystemExit('Missing required native architecture: ' + arch)
              subprocess.run([str(apksigner[-1]), 'verify', str(apk)], check=True)
              print('Verified package, API 28, architectures and APK signature: ' + apk.name)
          PY

      - name: Remove temporary release keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/liftria-release.jks"
