name: Phase 0 code and Android verification

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'PHASE_0_ISSUES.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase0-${{ github.ref }}
  # A newer push to the same PR makes the running 40-minute build pointless.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Reproducible clean dependency install
        run: npm ci --no-audit --no-fund
      - name: Validate Expo SDK versions and native peer dependency tree
        run: |
          npx expo install --check
          npm ls react-native-reanimated react-native-worklets
      - name: TypeScript, lint, Jest
        run: npm run check

  android-build:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
      - name: Free disk for ARM64 native compilation
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      # Caches Gradle dependencies and wrapper between runs.
      - uses: gradle/actions/setup-gradle@v5
      - name: Install reproducible dependencies
        run: npm ci --no-audit --no-fund
      - name: Expo Android prebuild
        run: npx expo prebuild --clean --platform android --no-install
      - name: Compile S22 Ultra ARM64 debug (dev client) and embedded-bundle release APKs
        working-directory: android
        run: ./gradlew assembleDebug assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon --max-workers=2
      # Upload before the permission gate so a failed gate still leaves the APKs to inspect.
      - name: Upload debug and release APK artifacts
        uses: actions/upload-artifact@v6
        with:
          name: liftria-phase0-s22-arm64-apks
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Check release APK permissions
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          ANDROID = '{http://schemas.android.com/apk/res/android}'
          FORBIDDEN = {
              'android.permission.RECORD_AUDIO',
              'android.permission.SYSTEM_ALERT_WINDOW',
              'android.permission.CAMERA',
          }

          def permissions(variant):
              found = list(Path('android/app/build/intermediates/merged_manifests').glob(f'{variant}/**/AndroidManifest.xml'))
              if not found:
                  raise SystemExit(f'No merged {variant} manifest found; permissions unverified')
              root = ET.parse(found[0]).getroot()
              return sorted(
                  (child.get(ANDROID + 'name'), child.get(ANDROID + 'maxSdkVersion'))
                  for child in root
                  if child.tag in ('uses-permission', 'uses-permission-sdk-23')
              )

          # The debug (dev client) build legitimately gets SYSTEM_ALERT_WINDOW from
          # React Native's debug manifest for the dev overlay; it is informational only.
          for variant in ('debug', 'release'):
              print(f'== {variant} ==')
              for name, max_sdk in permissions(variant):
                  print(f'{name} maxSdkVersion={max_sdk or "none"}')

          shipped = {name for name, _ in permissions('release')} & FORBIDDEN
          if shipped:
              raise SystemExit(f'Forbidden permission in release APK: {sorted(shipped)}')
          print('Release APK permissions OK')
          PY
